<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast</title>
    <!-- tailwindCSS using CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" href="/icon/Weather_31085.ico" type="image/png">
    <link rel="stylesheet" href="style.css">

  </head>

  <body class="bg-green-100 min-h-screen p-2 md:p-4" id="mainBody">

    <!-- Navigation Bar -->
    <header class="nav_bar flex flex-col md:flex-row items-center justify-between p-4 md:p-8 bg-white shadow-lg rounded-2xl m-2 md:m-4 gap-4 md:gap-0">
      <h1 class="text-xl md:text-2xl font-bold text-gray-800 text-center"> Weather Forecast </h1>

      <div class="flex flex-col md:flex-row items-center gap-2 md:gap-4 w-full md:w-auto">
        <div class="flex flex-col md:flex-row items-center gap-2 w-full md:w-auto">
          <label for="city" class="text-gray-700 font-semibold text-sm md:text-base">City:</label>
          <div class="relative w-full md:w-auto">
            <input
              type="text"
              id="city"
              placeholder="enter city"
              class="border-2 border-gray-400 rounded-lg px-3 py-2 md:px-4 md:py-2 w-full md:w-72 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-300 transition text-sm md:text-base"/>
            <ul id="recent_dropd" class="absolute bg-white border border-gray-300 rounded-lg mt-1 w-full shadow-md z-10 hidden max-h-48 overflow-y-auto text-sm">
            </ul>
          </div>
        </div>

        <button id="search_button" type="button" class="bg-green-500 text-white px-3 py-2 md:px-4 md:py-2 rounded-lg hover:bg-green-600 transition font-semibold text-sm md:text-base w-full md:w-auto">Search</button>
        <p class="hidden md:inline">or</p>
        <button id="location" type="button" class="bg-blue-500 text-white px-3 py-2 md:px-5 md:py-2 rounded-lg hover:bg-blue-600 transition font-semibold text-sm md:text-base w-full md:w-auto"> Use Current Location </button>
      </div>

    </header>
    <!-- Current Day Forecast -->
    <main class="p-2 md:p-8">
      <div class="main_content max-w-6xl mx-auto flex flex-col lg:flex-row gap-4 md:gap-8">
        <div class="w-full lg:flex-1">
          <div class="bg-white rounded-lg shadow-lg p-4 md:p-6">
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-3 mb-4">
              <h2 class="text-xl md:text-2xl font-bold text-gray-800">
                Today's Weather
              </h2>
              <button id="temp_togg" type="button" class="bg-blue-600 text-white px-3 py-2 md:px-4 md:py-2 rounded-lg hover:bg-blue-700 transition font-semibold text-sm md:text-base w-full md:w-auto">
                °C / °F
              </button>
            </div>
            <div id="error_box" class="hidden mb-3 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm"></div>
            <div id="alert_box" class="hidden mb-3 p-3 bg-orange-100 border border-orange-400 text-orange-800 rounded-lg text-sm font-semibold"></div>
            <div id="weather1" class="text-gray-600">Search a city or use your current location.</div>
          </div>
        </div>

        <!-- next 5 days of forecast (added dynamically)-->
        <div class="w-full lg:flex-1">
          <div id="forecast_container" class="flex flex-col gap-4">
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
